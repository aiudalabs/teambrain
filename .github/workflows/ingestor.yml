# teambrain/.github/workflows/ingestor.yml
# Runs IN teambrain when new digests land in raw/. Executes the Librarian
# prompt and opens a PR against wiki/ — never writes directly to main.
#
# v0: EVERY knowledge PR requires human approval (branch protection on main).
# The deterministic auto-merge gate for low-impact changes comes later —
# reviewing everything at first is the safe default and calibrates the prompt.

name: ingestor
on:
  push:
    branches: [main]
    paths: ['raw/**']

concurrency:
  group: ingestor          # serialize: never two ingestions racing over the wiki
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingerir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new digests
        id: nuevos
        run: |
          git diff --name-only HEAD~1 HEAD -- 'raw/**' | grep '\.md$' > nuevos.txt || true
          [ -s nuevos.txt ] || { echo "skip=true" >> "$GITHUB_ENV"; exit 0; }
          echo "New digests:"; cat nuevos.txt

      - name: Run the Librarian (Copilot CLI)
        if: env.skip != 'true'
        env:
          # ⚠ VERIFY env var name via: copilot help environment
          GH_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          npm install -g @github/copilot >/dev/null 2>&1
          {
            cat .teambrain/prompts/ingestor.md
            echo; echo "## NEW DIGESTS TO PROCESS"
            while read -r f; do echo; echo "### $f"; cat "$f"; done < nuevos.txt
          } > full-prompt.txt
          # The agent works on the checkout: it can read the whole wiki and
          # edit files. Scoped tools: read-only shell + write.
          copilot -p "$(cat full-prompt.txt)" \
            --allow-tool write \
            --allow-tool 'shell(cat,ls,grep,find,head,tail)' \
            -s | tee salida-agente.md

      - name: Open knowledge PR
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "teambrain[bot]"
          git config user.email "teambrain[bot]@users.noreply.github.com"
          # Only changes to wiki/ and index.md — any attempt on raw/ is discarded
          git checkout -- raw/ 2>/dev/null || true
          git add wiki/ index.md log.md 2>/dev/null || true
          git diff --cached --quiet && { echo "The Librarian proposed no changes (valid discards)"; exit 0; }
          BR="ingest/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          git commit -m "ingest: $(wc -l < nuevos.txt | tr -d ' ') digest(s)"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "🧠 New knowledge: $(date -u +%F)" \
            --body-file salida-agente.md \
            --label knowledge
