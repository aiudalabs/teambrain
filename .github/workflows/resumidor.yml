# teambrain/.github/workflows/resumidor.yml
# REUSABLE workflow — lives in teambrain, called by product repos.
#
# Required secrets (ORG level, configured once):
#   COPILOT_CLI_TOKEN   Fine-grained PAT from an account with a Copilot license,
#                       to authenticate copilot CLI in Actions.
#                       ⚠ VERIFY: exact env var name via `copilot help environment`.
#   TB_APP_ID / TB_APP_PRIVATE_KEY   GitHub App "teambrain[bot]" with
#                       contents:write ONLY on the teambrain repo.
#
# Caller in each product repo (.github/workflows/teambrain.yml):
#   name: teambrain
#   on:
#     pull_request: { types: [closed] }
#     issues: { types: [closed] }
#   jobs:
#     resumir:
#       if: github.event.pull_request.merged == true || github.event_name == 'issues'
#       uses: aiudalabs/teambrain/.github/workflows/resumidor.yml@main
#       secrets: inherit

name: resumidor
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write   # for the "🧠 learned…" transparency comment
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR/issue context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            N=${{ github.event.pull_request.number }}
            gh pr view "$N" --repo "$GITHUB_REPOSITORY" \
              --json title,body,comments,reviews > ctx.json
            gh pr diff "$N" --repo "$GITHUB_REPOSITORY" | head -c 60000 > diff.txt
            echo "kind=pr" >> "$GITHUB_OUTPUT"; echo "num=$N" >> "$GITHUB_OUTPUT"
          else
            N=${{ github.event.issue.number }}
            gh issue view "$N" --repo "$GITHUB_REPOSITORY" \
              --json title,body,comments > ctx.json
            : > diff.txt
            echo "kind=issue" >> "$GITHUB_OUTPUT"; echo "num=$N" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch canonical prompt from teambrain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/aiudalabs/teambrain/contents/.teambrain/prompts/resumidor.md \
            --jq .content | base64 -d > prompt.md

      - name: Generate digest with Copilot CLI
        env:
          # ⚠ VERIFY env var name via: copilot help environment
          GH_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          npm install -g @github/copilot >/dev/null 2>&1
          {
            sed -e "s/{{REPO}}/${GITHUB_REPOSITORY#*/}/" \
                -e "s/{{NUMERO}}/${{ steps.ctx.outputs.num }}/" \
                -e "s/{{ACTOR}}/${{ github.actor }}/" \
                -e "s/{{FECHA}}/$(date -u +%F)/" prompt.md
            echo; echo "## CONTEXT"; cat ctx.json; echo; echo "## DIFF"; cat diff.txt
          } > full-prompt.txt
          copilot -p "$(cat full-prompt.txt)" -s > digest.md || true
          grep -qx 'SKIP' digest.md && { echo "skip=true" >> "$GITHUB_ENV"; exit 0; } || true
          [ -s digest.md ] || echo "skip=true" >> "$GITHUB_ENV"

      - name: teambrain[bot] App token
        if: env.skip != 'true'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TB_APP_ID }}
          private-key: ${{ secrets.TB_APP_PRIVATE_KEY }}
          owner: aiudalabs
          repositories: teambrain

      - name: Commit digest to teambrain/raw
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          REPO_SHORT="${GITHUB_REPOSITORY#*/}"
          DEST="raw/github/$REPO_SHORT/$(date -u +%F)-${{ steps.ctx.outputs.kind }}${{ steps.ctx.outputs.num }}.md"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/aiudalabs/teambrain.git" tb
          mkdir -p "tb/$(dirname "$DEST")"
          cp digest.md "tb/$DEST"
          cd tb
          git config user.name "teambrain[bot]"
          git config user.email "teambrain[bot]@users.noreply.github.com"
          git add -A
          git commit -m "digest: $REPO_SHORT#${{ steps.ctx.outputs.num }} by @${{ github.actor }}"
          git push

      - name: Transparency comment on the source PR
        if: env.skip != 'true' && steps.ctx.outputs.kind == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ steps.ctx.outputs.num }} --repo "$GITHUB_REPOSITORY" \
            --body "🧠 TeamBrain learned from this PR — digest at \`raw/github/${GITHUB_REPOSITORY#*/}/\`"
